<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hors ligne — SAV</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fafaf9;
    color: #1c1c1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #101014; color: #f2f2f4; }
  }
  .card { max-width: 360px; padding: 32px 24px; text-align: center; }
  .logo {
    width: 44px;
    height: 44px;
    margin: 0 auto 20px;
    border-radius: 12px;
    background: #2952a3;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.04em;
  }
  h1 { font-size: 17px; margin: 0 0 8px; }
  p { font-size: 13px; line-height: 1.6; color: #6b6b70; margin: 0 0 24px; }
  @media (prefers-color-scheme: dark) { p { color: #9a9aa2; } }
  button {
    border: none;
    border-radius: 10px;
    background: #2952a3;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 20px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">SAV</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Impossible de charger cette page sans connexion. Toute action déjà enregistrée sera envoyée automatiquement dès que vous serez de nouveau en ligne.</p>
    <button onclick="location.reload()">Réessayer</button>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
